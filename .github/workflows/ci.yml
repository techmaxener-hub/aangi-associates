name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  crm:
    name: CRM — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/crm/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  website:
    name: Website — calculator formula tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  deploy:
    name: Deploy to Hostinger (FTP)
    needs: [crm, website]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/crm/package-lock.json

      # The backend is now apps/crm-api/ (plain PHP + MySQL on this same
      # Hostinger host, see apps/crm-api/README.md) — the Supabase project
      # this used to point at was deleted. /api is a same-origin relative
      # path, not a secret, safe to bake into the bundle.
      - name: Build CRM
        working-directory: apps/crm
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci
          npm run build

      # 3 independent uploads to the SAME Hostinger FTP account (an
      # aa.tmarinternational.com-scoped account, so "/" here already
      # means that subdomain's own document root — not the server's
      # actual filesystem root). packages/ui deploys as a subfolder of
      # that same document root rather than a sibling above it, so this
      # never depends on knowing how deep the FTP account's root sits
      # in the real filesystem.
      - name: Deploy website (document root)
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: apps/website/
          server-dir: /
          exclude: |
            package.json
            **/*.test.js

      - name: Deploy shared design system (packages/ui)
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: packages/ui/
          server-dir: /packages/ui/

      - name: Deploy CRM build (/app/ subpath)
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: apps/crm/dist/
          server-dir: /app/

      # apps/crm-api/env.php (real DB/WhatsApp/SMS credentials) is
      # gitignored — it never exists in this checkout, so it's never
      # overwritten by this step. Create/edit it once directly on the
      # server (Hostinger file manager or a one-off FTP client), from
      # env.example.php. setup_admin.php is deliberately excluded from
      # every automated deploy after the first — CI would otherwise keep
      # re-uploading it even after you delete it post-bootstrap; upload
      # it manually the one time you need it.
      - name: Deploy CRM API (/api/ subpath)
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: apps/crm-api/
          server-dir: /api/
          exclude: |
            env.php
            env.example.php
            setup_admin.php
            schema.sql
            seed.sql
            README.md
