<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Aangi Associates</title>
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="contact">

<div data-include="header" data-include-base="../../packages/ui/partials"></div>

<main>

  <!-- Hero -->
  <section class="section" id="hero" style="text-align: center;">
    <div class="container">
      <span class="placeholder-note">[Pass 1 — structural placeholder]</span>
      <h1>[Contact hero headline placeholder]</h1>
    </div>
  </section>

  <!-- Contact Grid: Office card + Form card -->
  <section class="section" id="contact-grid">
    <div class="container grid grid-2">
      <div class="card">
        <h3>[Office card headline placeholder]</h3>
        <p>Aangi Associates<br>
        8615, Krupal Pathshala, Shivaranjani Cross Road, Ahmedabad<br>
        <a href="tel:+919033132791">+91 90331 32791</a></p>
        <a class="btn btn-primary" href="https://wa.me/919033132791" target="_blank" rel="noopener">[WhatsApp CTA placeholder] →</a>
      </div>

      <div class="card">
        <h3>[Form card headline placeholder]</h3>
        <form>
          <div class="field">
            <label for="contact-name">Name</label>
            <input id="contact-name" type="text" disabled placeholder="Placeholder — not yet interactive">
          </div>
          <div class="field">
            <label for="contact-phone">Phone</label>
            <input id="contact-phone" type="text" disabled placeholder="Placeholder — not yet interactive">
          </div>
          <div class="field">
            <label for="contact-interest">Interested In</label>
            <select id="contact-interest" disabled>
              <option>Protection</option>
              <option>Wealth</option>
              <option>Retirement</option>
              <option>Business</option>
              <option>General</option>
              <option>Associate Program</option>
            </select>
          </div>
          <div class="field">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" rows="3" disabled placeholder="Placeholder — not yet interactive"></textarea>
          </div>
          <button class="btn btn-primary" type="button" disabled>[Submit via WhatsApp placeholder]</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Map -->
  <section class="section" id="map">
    <div class="container">
      <div class="media-placeholder" aria-hidden="true">[Map embed placeholder]</div>
    </div>
  </section>

</main>

<div data-include="footer" data-include-base="../../packages/ui/partials"></div>
<script src="../../packages/ui/include.js"></script>
</body>
</html>
