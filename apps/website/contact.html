      <div class="card reveal">
        <h3>Send us your details</h3>
        <form id="contact-form">
          <div class="field field-honeypot" aria-hidden="true">
            <label for="contact-website">Website</label>
            <input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off">
          </div>
          <div class="field">
            <label for="contact-name">Name</label>
            <input id="contact-name" name="name" type="text" required autocomplete="name">
          </div>
          <div class="field">
            <label for="contact-phone">Phone</label>
            <input id="contact-phone" name="phone" type="tel" required autocomplete="tel" pattern="[0-9+\-\s()]{7,15}" title="Enter a valid phone number (7-15 digits)">
          </div>
          <div class="field">
            <label for="contact-interest">Interested In</label>
            <select id="contact-interest" name="interest" required>
              <option value="">Select one</option>
              <option value="Protection">Protection</option>
              <option value="Wealth">Wealth</option>
              <option value="Retirement">Retirement</option>
              <option value="Business">Business</option>
              <option value="General">General</option>
              <option value="Associate Program">Associate Program</option>
            </select>
          </div>
          <div class="field">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="3"></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Send via WhatsApp →</button>
          <p class="form-status" data-form-status></p>
        </form>
